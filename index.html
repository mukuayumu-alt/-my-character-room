<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>My Character Room</title>
<style>
:root{--bg:#101014;--panel:#1b1b22;--panel2:#24242d;--text:#f5f3f7;--muted:#aaa6b2;--accent:#c79bff;--line:#34323d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{position:sticky;top:0;z-index:3;background:#101014ed;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:750;letter-spacing:.3px}.tag{font-size:11px;color:var(--muted)}
button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#1a1024;font-weight:700}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
main{max-width:760px;margin:auto;padding:16px 14px 110px}
.tabs{display:flex;gap:8px;margin:4px 0 16px}.tabs button{flex:1}.tabs button.active{background:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#121218;color:var(--text);padding:12px;outline:none}
textarea{min-height:74px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portrait{min-height:245px;height:auto;border-radius:16px;background:linear-gradient(145deg,#4a3b62,#1d293b 55%,#14151b);display:flex;align-items:center;justify-content:center;text-align:center;color:#e9ddff;padding:20px;position:relative;overflow:visible}
.portrait:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#e5c8ff22;top:-55px;right:-35px}
.avatar{font-size:58px;position:relative}.portrait small{display:block;color:#ded5eb;margin-top:8px}
.scenechip{display:inline-block;background:#30283d;color:#e4d2ff;border-radius:20px;padding:6px 10px;font-size:12px;margin-top:9px}
.messages{display:flex;flex-direction:column;gap:10px;margin-top:14px}.msg{max-width:88%;padding:11px 13px;border-radius:15px;line-height:1.5;font-size:14px;white-space:pre-wrap}.bot{background:var(--panel2);align-self:flex-start}.user{background:#594477;align-self:flex-end}
.composer{position:fixed;bottom:0;left:0;right:0;background:#101014f5;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:4}.composer input{flex:1;min-width:0}
.note{font-size:12px;color:var(--muted);line-height:1.55}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.portrait{height:210px}}
</style>
</head>
<body>

<header><div><div class="brand">My Character Room</div><div class="tag">自分専用 AIキャラクターアプリ（試作版）</div></div><button class="secondary" id="settingsBtn">設定</button></header>
<main>
<div class="tabs">
<button class="active" id="chatTab">会話</button><button class="secondary" id="editTab">キャラクター設定</button><button class="secondary" id="sceneTab">場面設定</button>
</div>
<section id="chatPage">
<div class="card">
<div class="portrait" id="portrait"><div><img id="characterImage" src="FF29FD44-D833-4F2B-B1D3-3AAE6DECEE29.png" alt="ふみ" style="width:100%; max-width:400px; height:auto; max-height:none; object-fit:contain; display:block; margin:10px auto; border-radius:16px;" max-width:400px; display:block; margin:10px auto; border-radius:16px;"><b id="heroName">あかり</b><small id="heroDesc">あなたのキャラクター</small><div class="scenechip" id="sceneChip">場面：自宅・リビング</div></div></div>
<div class="row" style="margin-top:10px"><button class="secondary" id="changeScene">場面を変更</button><button class="secondary" id="newChat">会話をリセット</button></div>
<div class="messages" id="messages"><div class="msg bot">こんにちは。今日はどんな一日にしようか？</div></div>
</div>
<p class="note">試作版：現在の返答は画面確認用の簡易応答です。本物のAI会話には、安全なサーバー経由でAI APIを接続する次の工程が必要です。</p>
</section>
<section id="editPage" class="hidden">
<div class="card"><h2>キャラクターを設定</h2>
<label>名前</label><input id="name" value="あかり">
<div class="grid"><div><label>年齢</label><input id="age" value="25" inputmode="numeric"></div><div><label>画像の雰囲気</label><select id="style"><option>実写風</option><option>アニメ・イラスト風</option></select></div></div>
<label>性格</label><textarea id="personality">明るく親しみやすい。相手の話をよく聞き、自然な口調で話す。</textarea>
<label>話し方・口調</label><input id="voice" value="自然な日本語。親しみやすい口調。">
<label>容姿・服装</label><textarea id="appearance" placeholder="髪型、髪色、服装など"></textarea>
<label>関係性</label><input id="relationship" value="仲の良い友人">
<button id="saveCharacter" style="width:100%;margin-top:14px">設定を保存</button>
</div></section>
<section id="scenePage" class="hidden">
<div class="card"><h2>現在の場面を設定</h2>
<label>場所</label><select id="place"><option>自宅・リビング</option><option>自宅・キッチン</option><option>自宅・寝室</option><option>海・砂浜</option><option>海辺のカフェ</option><option>レストラン</option><option>カフェ</option><option>映画館</option><option>公園</option><option>ホテル</option><option>温泉</option><option>職場</option><option>自由入力</option></select>
<div id="customPlaceWrap" class="hidden"><label>場所を入力</label><input id="customPlace" placeholder="例：京都の旅館"></div>
<div class="grid"><div><label>時間帯</label><select id="time"><option>朝</option><option>昼</option><option selected>夕方</option><option>夜</option></select></div><div><label>天気</label><select id="weather"><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div></div>
<label>服装・状況</label><input id="outfit" placeholder="例：夏服、水着、部屋着など">
<label>一緒にいる人・状況</label><textarea id="situation" placeholder="例：二人で海辺を散歩している"></textarea>
<div class="row" style="margin-top:14px"><button id="applyScene">場面を適用</button><button class="secondary" id="autoScene">会話から自動変更 ON</button></div>
<p class="note">自動変更は、メッセージに「海に行こう」「家に帰ろう」などの表現がある場合に、試作ルールで場面を切り替えます。本格AI接続後は会話の文脈から判断する方式に拡張します。</p>
</div></section>
</main>
<div class="composer" id="composer"><input id="messageInput" placeholder="メッセージを入力…" autocomplete="off"><button id="sendBtn">送信</button></div>
<script>
const $=id=>document.getElementById(id);
let scene={place:"自宅・リビング",time:"夕方",weather:"晴れ",outfit:"",situation:""};
let auto=true, history=[];
function show(tab){["chatPage","editPage","scenePage"].forEach((id,i)=>$(id).classList.toggle("hidden",i!==tab));["chatTab","editTab","sceneTab"].forEach((id,i)=>$(id).classList.toggle("active",i===tab));$("composer").classList.toggle("hidden",tab!==0)}
$("chatTab").onclick=()=>show(0);$("editTab").onclick=()=>show(1);$("sceneTab").onclick=()=>show(2);$("settingsBtn").onclick=()=>show(1);
function sceneLabel(){return `場面：${scene.place}／${scene.time}・${scene.weather}`}
function updateScene(){
  $("sceneChip").textContent=sceneLabel();
  $("heroDesc").textContent=`${$("age").value}歳・${$("style").value}／${$("relationship").value}`;

  const img = $("characterImage");

  if(sceneLabel().includes("海")){
    img.src="FF29FD44-D833-4F2B-B1D3-3AAE6DECEE29.png";
  }
}
$("saveCharacter").onclick=()=>{let n=$("name").value.trim()||"キャラクター";$("heroName").textContent=n;updateScene();alert("キャラクター設定を保存しました（この端末内）。");show(0)};
$("place").onchange=()=> $("customPlaceWrap").classList.toggle("hidden",$("place").value!=="自由入力");
$("applyScene").onclick=()=>{scene={place:$("place").value==="自由入力"?($("customPlace").value||"自由入力"):$("place").value,time:$("time").value,weather:$("weather").value,outfit:$("outfit").value,situation:$("situation").value};updateScene();addMsg("bot",`場面を変更したよ。今は${scene.place}にいるんだね。${scene.time}で${scene.weather}。${scene.situation}`);show(0)};
$("changeScene").onclick=()=>show(2);
$("autoScene").onclick=()=>{auto=!auto;$("autoScene").textContent=`会話から自動変更 ${auto?"ON":"OFF"}`};
function addMsg(who,text){let d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;history.push({who,text})}
function detectScene(t){let p=null;if(/海|ビーチ|砂浜/.test(t))p="海・砂浜";else if(/家に帰|自宅|うちに|家で/.test(t))p="自宅・リビング";else if(/カフェ|コーヒー/.test(t))p="カフェ";else if(/レストラン|ご飯を食べ/.test(t))p="レストラン";else if(/映画館|映画を見/.test(t))p="映画館";else if(/温泉/.test(t))p="温泉";else if(/公園/.test(t))p="公園";if(p&&auto){scene.place=p;updateScene();addMsg("bot",`場面を「${p}」に切り替えたよ。`)}}
function reply(t){let n=$("name").value||"あかり";let p=$("personality").value;let lower=t.toLowerCase();if(/こんにちは|おはよう|こんばんは/.test(t))return `こんにちは！会えてうれしいな。今は${scene.place}にいるね。今日はどんな話をしよう？`;if(/海/.test(t))return `海っていいね。${scene.place}の景色を一緒に楽しみたいな。どんなふうに過ごそうか？`;if(/好き|大好き/.test(t))return `そう言ってくれてありがとう。ちょっと照れちゃうな。あなたは今、どんな気持ち？`;if(/何して|なにして/.test(t))return `今は${scene.place}で、あなたと話しているところだよ。そっちは何してた？`;return `うん、${t}なんだね。もう少し聞かせてほしいな。${scene.situation?`今は${scene.situation}という状況だね。`:""}あなたはどう思っている？`}
async function send(){
  let t=$("messageInput").value.trim();
  if(!t)return;

  addMsg("user",t);
  $("messageInput").value="";
  detectScene(t);

  let messages=history.map(m=>({
    role:m.who==="bot"?"assistant":"user",
    content:m.text
  }));

  let last=messages[messages.length-1];

  last.content +=
    "\nあなたの名前："+$("name").value+
    "\n年齢："+$("age").value+
    "\n性格："+$("personality").value+
    "\n話し方："+$("voice").value+
    "\n容姿・服装："+$("appearance").value+
    "\n関係性："+$("relationship").value+
    "\n現在の場面："+sceneLabel()+
    "\n服装："+scene.outfit+
    "\n状況："+scene.situation+
    "\nキャラクターとして自然な日本語で会話してください。";

  try{
    let r=await fetch(
      "https://old-grass-0138.dorakueomoroinaa.workers.dev/",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages})
      }
    );

    let data=await r.json();

    if(!r.ok){
      throw new Error(data.error||"接続エラー");
    }

    addMsg("bot",data.reply);

  }catch(e){
    addMsg("bot","接続エラー："+e.message);
  }
}
$("sendBtn").onclick=send;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("newChat").onclick=()=>{if(confirm("会話をリセットしますか？")){$("messages").innerHTML="";history=[];addMsg("bot","また最初から話そう。今日はどんな一日にする？")}};
updateScene();
</script>
</body></html>
